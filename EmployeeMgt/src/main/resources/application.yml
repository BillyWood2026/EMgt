server:
  port: 8083

spring:
  application:
    name: employee-mgt
  datasource:
    url: jdbc:mysql://localhost:3306/employee_mgt?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: Sun-0126King-0325
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # schema.sql 为手动执行的全新建表脚本(含 DROP)，禁止启动时自动执行，避免抹除真实数据
      mode: never
      schema-locations: classpath:schema.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
