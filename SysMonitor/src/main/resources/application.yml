server:
  port: 8112

spring:
  application:
    name: sys-monitor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sys_monitor}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Sun-0126King-0325}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  cloud:
    nacos:
      discovery:
        enabled: ${MICROSERVICE_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${SERVICE_GROUP:DEFAULT_GROUP}
        register-enabled: ${SERVICE_REGISTER_ENABLED:true}
      config:
        enabled: ${CONFIG_SERVER_ENABLED:false}
        server-addr: ${NACOS_CONFIG_ADDR:127.0.0.1:8848}
        file-extension: yml
        refresh-enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  mapper-locations: classpath:mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.sysmonitor: ${LOG_LEVEL:DEBUG}
    com.example.sysmonitor.mapper: ${LOG_LEVEL_MAPPER:DEBUG}

---
spring:
  config:
    activate:
      on-profile: microservice
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
      config:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: full
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
      config:
        enabled: true