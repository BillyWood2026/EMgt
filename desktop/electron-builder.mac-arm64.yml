appId: com.emgt.hrm
productName: HRM Platform
copyright: Copyright (c) 2026 EMgt
asar: true
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - "!src/config/**"
  - package.json

extraResources:
  - from: vendor/jars
    to: jars
  - from: vendor/frontend/dist
    to: frontend
  - from: vendor/db-dump
    to: db-dump
  - from: src/config
    to: config
  - from: runtime/darwin-arm64/jre
    to: runtime/jre
  - from: runtime/darwin-arm64/mysql
    to: runtime/mysql

mac:
  target:
    - dmg
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-mac-arm64.${ext}
