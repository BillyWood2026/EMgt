<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HRM Platform - Error</title>
<style>
  body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #fafafa; color: #333; padding: 40px; }
  .card { background: #fff; border-left: 4px solid #c62828; border-radius: 6px; padding: 24px 28px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 20px; color: #c62828; margin-bottom: 12px; }
  pre { white-space: pre-wrap; word-break: break-all; background: #f5f5f5; padding: 12px; border-radius: 4px; font-size: 13px; max-height: 220px; overflow: auto; }
  .row { margin-top: 20px; display: flex; gap: 12px; }
  button { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .retry { background: #1f4e8c; color: #fff; }
  .quit { background: #e0e0e0; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="t">Error</h1>
    <pre id="d"></pre>
    <div class="row">
      <button class="retry" onclick="location.reload()">Retry</button>
      <button class="quit" onclick="window.hrm.quit()">Quit</button>
    </div>
  </div>
<script>
  const info = window.hrm.errorInfo();
  document.getElementById('t').textContent = info.title || 'Error';
  document.getElementById('d').textContent = info.detail || '';
</script>
</body>
</html>
