<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HRM Platform - Service Status</title>
<style>
  body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f5f7fa; padding: 16px; }
  h1 { font-size: 16px; margin-bottom: 4px; }
  .sum { font-size: 12px; color: #666; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  th, td { text-align: left; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid #eee; }
  th { background: #1f4e8c; color: #fff; }
  .up { color: #2e7d32; font-weight: 600; }
  .down { color: #c62828; font-weight: 600; }
  button { padding: 2px 10px; font-size: 11px; border: 1px solid #1f4e8c; background: #fff; color: #1f4e8c; border-radius: 3px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .refresh { margin-bottom: 10px; padding: 5px 14px; font-size: 12px; background: #1f4e8c; color: #fff; border: none; }
</style>
</head>
<body>
  <h1>Service Status</h1>
  <div class="sum" id="sum">Loading...</div>
  <button class="refresh" onclick="load()">Refresh</button>
  <table>
    <thead><tr><th>Wave</th><th>Service</th><th>Port</th><th>Status</th><th></th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
<script>
  async function load() {
    const r = await window.hrm.getStatus();
    document.getElementById('sum').textContent =
      `${r.up}/${r.total} services up | login smoke: ${r.login.ok ? 'OK' : 'FAIL'}`;
    const tb = document.getElementById('tb');
    tb.innerHTML = '';
    for (const s of r.services) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>W${s.wave}</td><td>${s.name}</td><td>${s.port}</td>
        <td class="${s.up ? 'up' : 'down'}">${s.up ? 'UP' : 'DOWN'}</td>
        <td><button ${s.up ? 'disabled' : ''} onclick="restart('${s.name}', this)">Restart</button></td>`;
      tb.appendChild(tr);
    }
  }
  async function restart(name, btn) {
    btn.disabled = true; btn.textContent = '...';
    await window.hrm.restartService(name);
    setTimeout(load, 3000);
  }
  load();
</script>
</body>
</html>
