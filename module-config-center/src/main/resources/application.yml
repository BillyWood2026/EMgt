server:
  port: 9000

spring:
  application:
    name: module-config-center
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:standalone}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:module_config}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Sun-0126King-0325}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    nacos:
      discovery:
        enabled: ${MICROSERVICE_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${SERVICE_GROUP:DEFAULT_GROUP}
        register-enabled: ${SERVICE_REGISTER_ENABLED:true}
      config:
        enabled: ${CONFIG_SERVER_ENABLED:false}
        server-addr: ${NACOS_CONFIG_ADDR:127.0.0.1:8848}
        file-extension: yml
        refresh-enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.modconfig: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: microservice
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
      config:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: full
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
      config:
        enabled: true